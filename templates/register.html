<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 文档摘要生成器</title>
    <link href="{{ url_for('static', filename='css/bootstrap-5.3.0.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons-1.11.0.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header h1 {
            color: #2d3748;
            font-weight: 600;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .register-header p {
            color: #718096;
            font-size: 0.95rem;
        }

        .form-floating {
            margin-bottom: 1.2rem;
        }

        .form-floating .form-control {
            border: 2px solid #e2e8f0;
            padding: 1rem 0.75rem;
            height: calc(3.5rem + 2px);
            transition: all 0.3s ease;
        }

        .form-floating .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }

        .form-floating label {
            padding: 1rem 0.75rem;
            color: #718096;
        }

        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .login-link p {
            color: #718096;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .alert {
            display: none;
            margin-bottom: 1rem;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .form-text {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 0.3rem;
        }

        .input-group-text {
            background: transparent;
            border: 2px solid #e2e8f0;
            border-left: none;
            cursor: pointer;
        }

        .password-toggle {
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>创建账号</h1>
            <p>加入我们的文档摘要平台</p>
        </div>

        <div class="alert alert-danger" role="alert" id="errorMessage">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="errorText"></span>
        </div>

        <form id="registerForm">
            <div class="form-floating">
                <input type="text" class="form-control" id="username" placeholder="用户名" required>
                <label for="username"><i class="bi bi-person me-2"></i>用户名</label>
                <div class="form-text">用户名不能为 'admin'</div>
            </div>

            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="邮箱" required>
                <label for="email"><i class="bi bi-envelope me-2"></i>邮箱</label>
            </div>

            <div class="form-floating">
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="密码" required>
                    <span class="input-group-text" onclick="togglePassword('password', 'passwordToggleIcon')">
                        <i class="bi bi-eye-slash password-toggle" id="passwordToggleIcon"></i>
                    </span>
                    <label for="password"><i class="bi bi-lock me-2"></i>密码</label>
                </div>
            </div>

            <div class="form-floating">
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="确认密码" required>
                    <span class="input-group-text" onclick="togglePassword('confirmPassword', 'confirmPasswordToggleIcon')">
                        <i class="bi bi-eye-slash password-toggle" id="confirmPasswordToggleIcon"></i>
                    </span>
                    <label for="confirmPassword"><i class="bi bi-lock-fill me-2"></i>确认密码</label>
                </div>
            </div>

            <button type="submit" class="btn btn-register">
                <i class="bi bi-person-plus me-2"></i>创建账号
            </button>
        </form>

        <div class="login-link">
            <p>已有账号？<a href="/login">立即登录</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle-5.3.0.min.js') }}"></script>
    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // 切换密码可见性
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const passwordToggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
            } else {
                passwordInput.type = 'password';
                passwordToggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
            }
        }

        registerForm.onsubmit = async (e) => {
            e.preventDefault();
            errorMessage.style.display = 'none';
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                errorText.textContent = '两次输入的密码不一致';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '注册失败');
                }

                window.location.href = '/login';
            } catch (error) {
                errorText.textContent = error.message;
                errorMessage.style.display = 'block';
                errorMessage.scrollIntoView({ behavior: 'smooth' });
            }
        };
    </script>
</body>
</html>
