version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm_smart_analytics
    runtime: nvidia
    gpus: all
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./vllm_config.yaml:/app/config.yaml
    environment:
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-Coder-32B-Instruct}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_CONFIG_PATH=/app/config.yaml
    command: >
      --model ${MODEL_NAME:-Qwen/Qwen2.5-Coder-32B-Instruct}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --max-num-seqs 256
      --enable-chunked-prefill
      --guided-decoding-backend outlines
      --api-key vllm_api_key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis 用于缓存和任务队列 (可选)
  redis:
    image: redis:7-alpine
    container_name: vllm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: smart_analytics_network
